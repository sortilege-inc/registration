<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Kill Fee">
<title>Kill Fee</title>
<defs>
  <!-- Hazard stripes: the campaign site's own warning-light motif. -->
  <pattern id="hazard" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="56" height="56" fill="#0d0d0f"/>
    <rect width="28" height="56" fill="#f5e003"/>
  </pattern>
  <!-- Cut corners, as the theme's clip-path does in CSS. -->
  <clipPath id="cut">
    <polygon points="0,56 56,0 1144,0 1200,56 1200,844 1144,900 56,900 0,844"/>
  </clipPath>
</defs>

<g clip-path="url(#cut)">
  <rect width="1200" height="900" fill="#0d0d0f"/>

  <rect x="0" y="92" width="1200" height="44" fill="url(#hazard)"/>
  <rect x="0" y="764" width="1200" height="44" fill="url(#hazard)"/>

